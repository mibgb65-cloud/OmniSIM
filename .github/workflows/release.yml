name: Release signed APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use a version such as v1.0.0."
            exit 1
          fi

          version="${tag#v}"
          project_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          if [[ -z "${project_version}" || "${version}" != "${project_version}" ]]; then
            echo "::error::Tag ${tag} does not match app versionName ${project_version:-<missing>}."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OMNISIM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::OMNISIM_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/omnisim-release.jks"
          chmod 600 "${RUNNER_TEMP}/omnisim-release.jks"

      - name: Test, lint, and build release APK
        env:
          OMNISIM_KEYSTORE_PATH: ${{ runner.temp }}/omnisim-release.jks
          OMNISIM_KEYSTORE_PASSWORD: ${{ secrets.OMNISIM_KEYSTORE_PASSWORD }}
          OMNISIM_KEY_ALIAS: ${{ secrets.OMNISIM_KEY_ALIAS }}
          OMNISIM_KEY_PASSWORD: ${{ secrets.OMNISIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in OMNISIM_KEYSTORE_PASSWORD OMNISIM_KEY_ALIAS OMNISIM_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::${variable} is not configured."
              exit 1
            fi
          done

          chmod +x ./gradlew
          ./gradlew --no-daemon test lint assembleRelease

      - name: Prepare signed release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail

          source_apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "${source_apk}" ]]; then
            echo "::error::Expected signed release APK was not produced."
            exit 1
          fi

          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${apksigner}" ]]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          if ! "${apksigner}" verify --verbose --print-certs "${source_apk}"; then
            echo "::error::The release APK signature is invalid."
            exit 1
          fi

          expected_signer_digest="58146fc8f47be9fc5729f9c149dc8f17877a646692bb23c4f8130a2232d441cb"
          signer_digest="$("${apksigner}" verify --print-certs "${source_apk}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [[ "${signer_digest}" != "${expected_signer_digest}" ]]; then
            echo "::error::The release APK was signed with an unexpected certificate."
            exit 1
          fi

          mkdir -p release
          asset_name="OmniSIM-${{ steps.version.outputs.version }}-release.apk"
          cp "${source_apk}" "release/${asset_name}"
          (
            cd release
            sha256sum "${asset_name}" > "${asset_name}.sha256"
          )

          echo "path=release/${asset_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum=release/${asset_name}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.asset.outputs.path }}" \
            "${{ steps.asset.outputs.checksum }}" \
            --verify-tag \
            --title "OmniSIM ${{ steps.version.outputs.version }}" \
            --notes "This release contains an APK signed with the OmniSIM release certificate." \
            --generate-notes

      - name: Remove restored signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/omnisim-release.jks"
